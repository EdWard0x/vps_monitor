services:
  postgres_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vps_test
      POSTGRES_PASSWORD: vps_test
      POSTGRES_DB: vps_monitor_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vps_test -d vps_monitor_test"]
      interval: 2s
      timeout: 2s
      retries: 20
