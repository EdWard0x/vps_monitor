name: vps-monitor

# VPS 部署文件：不依赖项目源码或 Dockerfile，只从镜像仓库拉取应用镜像。
services:
  postgres:
    image: postgres:17-alpine
    container_name: vps-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vps_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vps_monitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: vps-monitor-flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      LOG_TIMESTAMP: "true"
      LOG_JSON: "false"
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - app

  backend:
    image: ${REGISTRY:-docker.io}/${IMAGE_NAMESPACE:?请设置 IMAGE_NAMESPACE}/vps-monitor-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: vps-monitor-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-vps_monitor}:${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vps_monitor}?sslmode=disable
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?请设置 JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请设置 JWT_REFRESH_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-vps-monitor}
      JWT_ACCESS_AUDIENCE: ${JWT_ACCESS_AUDIENCE:-vps-monitor-api}
      JWT_REFRESH_AUDIENCE: ${JWT_REFRESH_AUDIENCE:-vps-monitor-refresh}
      CSRF_SECRET: ${CSRF_SECRET:?请设置 CSRF_SECRET}
      CURSOR_SECRET: ${CURSOR_SECRET:?请设置 CURSOR_SECRET}
      FRONTEND_ORIGINS: https://${APP_DOMAIN:?请设置 APP_DOMAIN}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SEARCH_BACKEND: sql
      DEMO_MODE: "false"
      PROCESSOR_URL: ${PROCESSOR_URL:-http://flaresolverr:8191/v1}
      WORKER_SCAN_SECONDS: ${WORKER_SCAN_SECONDS:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      WORKER_MERCHANT_CONCURRENCY: ${WORKER_MERCHANT_CONCURRENCY:-2}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      flaresolverr:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5
    networks:
      app:
      nginx_gateway:
        aliases:
          - vps-monitor-backend

  frontend:
    image: ${REGISTRY:-docker.io}/${IMAGE_NAMESPACE:?请设置 IMAGE_NAMESPACE}/vps-monitor-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: vps-monitor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      app:
      nginx_gateway:
        aliases:
          - vps-monitor-frontend

volumes:
  postgres_data:

networks:
  app:
    driver: bridge
  nginx_gateway:
    external: true
    name: ${NGINX_NETWORK:-nginx}
