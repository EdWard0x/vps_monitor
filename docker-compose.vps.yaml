name: vps-monitor

# VPS 部署文件：不依赖项目源码或 Dockerfile，只从镜像仓库拉取应用镜像。
services:
  postgres:
    image: postgres:17-alpine
    container_name: vps-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vps_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vps_monitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  redis:
    image: redis:8-alpine
    container_name: vps-monitor-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-vps_monitor_dev}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-vps_monitor_dev}' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  backend:
    image: ${REGISTRY:-docker.io}/${IMAGE_NAMESPACE:?请设置 IMAGE_NAMESPACE}/vps-monitor-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: vps-monitor-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_MODE: ${APP_MODE:-runtime}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-vps_monitor}:${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vps_monitor}?sslmode=disable
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?请设置 JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请设置 JWT_REFRESH_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-vps-monitor}
      JWT_ACCESS_AUDIENCE: ${JWT_ACCESS_AUDIENCE:-vps-monitor-api}
      JWT_REFRESH_AUDIENCE: ${JWT_REFRESH_AUDIENCE:-vps-monitor-refresh}
      CSRF_SECRET: ${CSRF_SECRET:?请设置 CSRF_SECRET}
      CSRF_TOKEN_TTL_MINUTES: ${CSRF_TOKEN_TTL_MINUTES:-120}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-__Host-vps_csrf}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-true}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-vps_monitor_dev}
      REDIS_DB: ${REDIS_DB:-0}
      FROZEN_CACHE_TTL_SECONDS: ${FROZEN_CACHE_TTL_SECONDS:-300}
      STOCK_STREAM: ${STOCK_STREAM:-stock:observations}
      STOCK_CONSUMER_GROUP: ${STOCK_CONSUMER_GROUP:-vps-monitor}
      STOCK_CONSUMER_NAME: ${STOCK_CONSUMER_NAME:-worker-1}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      FRONTEND_ORIGINS: https://${APP_DOMAIN:?请设置 APP_DOMAIN}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      WORKER_ENABLED: ${WORKER_ENABLED:-false}
      START_WORKER: ${START_WORKER:-false}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-false}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5
    networks:
      app:
      nginx_gateway:
        aliases:
          - vps-monitor-backend

  frontend:
    image: ${REGISTRY:-docker.io}/${IMAGE_NAMESPACE:?请设置 IMAGE_NAMESPACE}/vps-monitor-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: vps-monitor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      app:
      nginx_gateway:
        aliases:
          - vps-monitor-frontend

volumes:
  postgres_data:
  redis_data:

networks:
  app:
    driver: bridge
  nginx_gateway:
    external: true
    name: ${NGINX_NETWORK:-nginx}
