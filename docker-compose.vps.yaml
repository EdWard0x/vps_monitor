name: vps-monitor

# VPS 部署：应用镜像从 GHCR 拉取，TLS 由外部 nginx_gateway 网络上的网关处理。

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vps_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vps_monitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${FLARE_LOG_LEVEL:-info}
    networks:
      - app

  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-edward0x}/vps-monitor-backend:${IMAGE_TAG:?请设置已发布的 IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      APP_ENV: production
      FRONTEND_ORIGINS: https://${APP_DOMAIN:?请设置 APP_DOMAIN}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-vps_monitor}:${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vps_monitor}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
      FLARE_RESOLVER_URL: ${FLARE_RESOLVER_URL:-http://flaresolverr:8191/v1}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?请设置 JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请设置 JWT_REFRESH_SECRET}
      CSRF_SECRET: ${CSRF_SECRET:?请设置 CSRF_SECRET}
      CSRF_COOKIE_SECURE: "true"
      # 入口脚本启动 /app/worker；Worker 进程据 WORKER_ENABLED 运行任务。
      WORKER_ENABLED: "true"
      START_WORKER: "true"
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flaresolverr:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5
    networks:
      - app

  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-edward0x}/vps-monitor-frontend:${IMAGE_TAG:?请设置已发布的 IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      app:
      nginx_gateway:
        aliases:
          - vps-monitor-frontend

volumes:
  postgres_data:
  redis_data:

networks:
  app:
    driver: bridge
  nginx_gateway:
    external: true
    name: ${NGINX_NETWORK:-nginx}
